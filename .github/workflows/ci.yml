name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run audit:api
      - name: Validate Expo project
        working-directory: apps/mobile
        run: npx expo-doctor@latest
      - name: Export responsive web build
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid/api/v1
        run: npx expo export --platform web --output-dir dist
